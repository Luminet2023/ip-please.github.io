name: frontend-test

on:
  push:
    branches: [main]
    paths:
      - 'cloud.js'
      - 'announce.js'
      - 'index.html'
      - 'screens.js'
      - 'tests/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'cloud.js'
      - 'announce.js'
      - 'index.html'
      - 'screens.js'
      - 'tests/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jsdom:
    name: cloud.js jsdom tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - run: npm ci
      - run: node --check ../../cloud.js && node --check ../../announce.js
      - run: npm test
