name: frontend-test

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'tools/**'
      - 'backend/src/endless/**'
      - 'tests/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'tools/**'
      - 'backend/src/endless/**'
      - 'tests/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jsdom:
    name: cloud.js jsdom tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - run: npm ci
      - run: for f in ../../*.js; do node --check "$f"; done
      - run: npm test
      - name: endless client + story regression
        working-directory: .
        run: |
          node tools/endless_client_test.js
          node tools/plot_regression_test.js
          node tools/smoke_test.js
          node tools/storage_namespace_test.js
