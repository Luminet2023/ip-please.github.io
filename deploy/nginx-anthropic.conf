# 把 /anthropic/ 反代到 ip-please-sync 容器（监听 127.0.0.1:8080）。
#
# 用法：在承载 api.luminet.cn 的 server 块里加一行：
#     include /etc/nginx/snippets/ip-please-anthropic.conf;
# 然后 nginx -t && systemctl reload nginx
#
# 常见错误（会导致浏览器报 CORS / 返回 HTML 而不是 JSON）：
#   1. 写成 root/alias/try_files 提供静态文件 —— 必须是 proxy_pass。
#   2. proxy_pass 带了路径（如 http://127.0.0.1:8080/anthropic/）—— 会改写 URI，
#      必须不带路径。
#   3. 在 location 里 return 204 处理 OPTIONS —— 预检会被本地吃掉且没有 CORS 头，
#      OPTIONS 必须转发给后端。
#   4. 又在 nginx 里 add_header Access-Control-Allow-Origin —— 后端已经返回 CORS 头，
#      重复会出现两个值，浏览器同样拒绝。
#   5. 把 location 放在正则 location 之后 —— 用 ^~ 前缀避免被正则/SPA 兜底抢走。

location ^~ /anthropic/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 存档上传体积上限；与后端 SYNC_MAX_PAYLOAD_BYTES 匹配
    client_max_body_size 1m;

    # 让 413/429 等错误语义透传
    proxy_request_buffering off;
    proxy_buffering off;

    # 超时
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
